repos:
  - repo: local
    hooks:
      - id: pytest
        name: Run unit tests
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        stages: [commit]
      - id: builder-gate
        name: Builder Gate (docs/decisions/*.md)
        entry: .venv/bin/python tools/gate_check.py
        language: system
        pass_filenames: true
        files: ^docs/decisions/.*\.md$
        stages: [commit]
